# Solo per le prove: simula la VM Azure (4 vCPU condivise, 8 GB di RAM) sopra docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.sim-azure.yml --profile modello up -d
services:
  verifica:
    cpuset: "0-3"
    mem_limit: 1536m
    memswap_limit: 1536m

  llm:
    cpuset: "0-3"
    mem_limit: 5g
    memswap_limit: 5g
    command: -m /modelli/${LLM_GGUF:-Ministral-3-3B-Instruct-2512-Q4_K_M.gguf} --jinja -c 8192 -t 4 --host 0.0.0.0 --port 8080
