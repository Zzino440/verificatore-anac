spring.application.name=verifica
server.port=8080

# configurazione del servizio, tutta da variabili d'ambiente
verifica.modalita=${MODALITA:script}
verifica.api-key=${API_KEY:}
verifica.dati-dir=${DATI_DIR:dati}
verifica.python=${PYTHON:python3}
verifica.script-dir=${SCRIPT_DIR:..}
verifica.script-timeout=${SCRIPT_TIMEOUT:120s}

# modello (llama.cpp, API compatibile OpenAI); usato solo con MODALITA=modello
spring.ai.openai.base-url=${LLM_URL:http://llm:8080}
spring.ai.openai.api-key=nessuna
spring.ai.openai.chat.options.model=${LLM_MODEL:ministral-3-3b}
spring.ai.openai.chat.options.temperature=${LLM_TEMPERATURE:0}

management.endpoints.web.exposure.include=health
